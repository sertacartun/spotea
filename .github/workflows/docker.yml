name: Docker image

# Publishes ghcr.io/sertacartun/spotea for amd64 and arm64 on every v* tag, so
# a NAS can install from a single compose file with no clone and no build.
# Pull requests that touch the image only build it, both architectures, so an
# arm64 break shows up there instead of in a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation: slower, but one job and one manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, 1 and latest; a manual run on a branch -> its name.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      # No build cache on purpose: the Dockerfile's floating yt-dlp/ytmusicapi
      # layer must re-run for every release, and a cache hit would ship
      # whatever extractor the previous release happened to get.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
