services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    # Optional: with no .env the defaults run as-is and SECRET_KEY is generated into ./data.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Small self-hosted deployment (single SQLite DB, no other services or
    # deploy/swarm config in this file), but downloads/yt-dlp
    # extraction/ffmpeg are spiky. 1.5G is generous headroom over normal
    # steady-state usage while still stopping a runaway extraction from
    # taking down the host instead of just its own container.
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # /health (app/main.py) does a real DB round-trip plus an in-process
    # scheduler check and is cheap, so a short interval/timeout is fine — but
    # startup itself does real work first (DB migrations, scheduler
    # bring-up), hence the longer start_period before failures count.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

# There was a second service here: bgutil-ytdlp-pot-provider, minting the PO
# (Proof-of-Origin) tokens YouTube demands from many clients before it will
# serve their media URLs. It is gone because no client this app asks for needs
# one — visionos and web_embedded, the whole of app/downloader.py's _ATTEMPTS,
# were both measured serving audio with the provider pointed at a dead port,
# and its log recorded zero requests across a rebuild and two downloads while
# it sat on 108 MB.
#
# Bringing it back, if YouTube extends the token requirement to those clients
# too: `image: brainicism/bgutil-ytdlp-pot-provider`, pinned to the same
# version as a `bgutil-ytdlp-pot-provider` install added to the Dockerfile —
# they are two halves of one pair and yt-dlp warns when they disagree, which
# is how they drifted apart last time. Then hand yt-dlp its address again with
# `"youtubepot-bgutilhttp": {"base_url": [...]}` in build_ydl_opts. Note that
# it cannot help an Android-family client (bgutil can't do DroidGuard), which
# is why it could not save android_vr.
