{# A track with no Content row yet: no /#player href or data-content-id. The data-* fields are what
   POST /explore/tracks/batch needs; data-video-id marks it as remote for home/detail.js. #}
<div
  class="track-row track-row-remote"
  data-video-id="{{ item.video_id }}"
  data-channel-id="{{ item.channel_id or '' }}"
  data-title="{{ item.title }}"
  data-thumbnail-url="{{ item.thumbnail_url or '' }}"
  data-duration-seconds="{{ item.duration_seconds or '' }}"
  data-channel-title="{{ item.channel_title or '' }}"
  data-artist-credit="{{ item.artist_credit or '' }}"
>
  <button type="button" class="track-link" aria-label="Play {{ item.title }}">
    <span class="track-index">{{ index }}</span>
    {# Fallback only in the <img>: data-thumbnail-url is stored, and a derived still must not be. #}
    <span class="track-thumb">
      {% set cover = item | cover %}
      {% if cover %}
      <img src="{{ cover }}" alt="" loading="lazy" />
      {% endif %}
    </span>
    <span class="track-info">
      <span class="track-title" title="{{ item.title }}">{{ item.title }}</span>
      {% if item.channel_title %}
      <span class="track-artist">{{ item.channel_title }}</span>
      {% endif %}
    </span>
  </button>
  <span class="track-duration">
    {{ item.duration_seconds | duration if item.duration_seconds else '' }}
  </span>
</div>
