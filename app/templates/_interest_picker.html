{# `chips` includes saved tags outside SUGGESTED_GENRES: the picker saves exactly the chips it shows.
   home/settings.js reads aria-pressed for selection; .is-on is presentation only. #}
<div class="interest-chips">
  {% for label, selected in chips %}
  <button
    type="button"
    class="genre-chip{{ ' is-on' if selected }}"
    data-genre="{{ label }}"
    aria-pressed="{{ 'true' if selected else 'false' }}"
  >{{ label }}</button>
  {% endfor %}
</div>
