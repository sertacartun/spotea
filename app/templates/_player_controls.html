{# Element ids are bound directly by player.js — keep them unscoped. Only included by _player_overlay.html. #}
    {# The only <audio> in the document, and it must stay so: a second element competes for iOS Now Playing
       and breaks the lock screen. See player.js's "Playback element" note. #}
    <audio id="audio" preload="auto"></audio>

    <div id="prepare-state" class="prepare-state" hidden>
      <span class="spinner" role="status"></span>
      <span id="prepare-text">Preparing audio…</span>
    </div>

    <div class="progress-block">
      <input type="range" id="seek-bar" class="range" min="0" max="100" step="0.1" value="0" aria-label="Seek" />
      <div class="progress-times">
        <span id="current-time">0:00</span>
        <span id="duration-time">{{ duration_label }}</span>
      </div>
    </div>

    {# prev/next stay disabled until a queue exists (home/overlay.js's syncQueueControls). #}
    <div class="transport">
      <button type="button" id="player-shuffle" class="btn-transport btn-shuffle" aria-pressed="false" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-shuffle" /></svg>
      </button>

      <button type="button" id="prev-track" class="btn-transport" aria-label="Previous track" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-skip-previous" /></svg>
      </button>

      <button type="button" id="play-pause" class="btn-play-main" aria-label="Play">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-play" /></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><use href="#i-pause" /></svg>
      </button>

      <button type="button" id="next-track" class="btn-transport" aria-label="Next track" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-skip-next" /></svg>
      </button>

      {# aria-label is rewritten per repeat state by player.js. #}
      <button type="button" id="player-repeat" class="btn-transport btn-repeat" data-repeat="off" aria-label="Repeat off" title="Repeat">
        <svg id="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-repeat" /></svg>
        <svg id="icon-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><use href="#i-repeat-one" /></svg>
      </button>
    </div>

    <div class="player-footer">
      <button type="button" id="queue-toggle" class="btn-quiet-icon" aria-expanded="false" aria-controls="queue-panel" aria-label="Queue" title="Queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-queue" /></svg>
      </button>

      <div class="volume-group">
        <button type="button" id="mute-btn" class="btn-quiet-icon" aria-label="Mute">
          <svg id="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-volume" /></svg>
          <svg id="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><use href="#i-volume-muted" /></svg>
        </button>
        <input type="range" id="volume-bar" class="range range-volume" min="0" max="100" value="100" aria-label="Volume" />
      </div>

      {# Disabled until a track is open and while offline (home/overlay.js): both are server writes. #}
      <button
        type="button"
        id="add-to-playlist-btn"
        class="btn-fav"
        aria-label="Add to playlist"
        title="Add to playlist"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-plus" /></svg>
      </button>

      <button
        type="button"
        id="favorite-btn"
        class="btn-fav{{ ' is-on' if favorite_is_on else '' }}"
        data-content-id="{{ favorite_content_id }}"
        data-favorite="{{ 'true' if favorite_is_on else 'false' }}"
        aria-pressed="{{ 'true' if favorite_is_on else 'false' }}"
        aria-label="Favorite"
      >
        <svg viewBox="0 0 24 24" fill="{{ 'currentColor' if favorite_is_on else 'none' }}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart" /></svg>
      </button>
    </div>
